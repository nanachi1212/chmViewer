<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHM 閱讀器</title>
<style>
*{box-sizing:border-box}body{font:16px "Microsoft JhengHei",sans-serif;color:#263b42;background:#f6f3ed;margin:0;height:100vh;display:flex;flex-direction:column}
header{padding:14px 20px;background:#526b78;color:white;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:42px;height:30px;border-radius:9px;background:#d9c2b8;color:#314d55;font-size:13px;font-weight:800;letter-spacing:.12em;box-shadow:inset 0 0 0 2px rgba(255,255,255,.26)}
h1{font-size:19px;margin:0;flex:1;min-width:140px}button,input,select{font:inherit;border:1px solid #b5c0bd;border-radius:6px;padding:8px 11px}
button{background:#edf1ea;color:#253d38;cursor:pointer}button:hover{background:#d9e3d7}
form,label{display:flex;gap:6px;align-items:center}input{width:210px}
main{display:flex;flex:1;min-height:0}aside{width:310px;min-width:230px;background:#eeeee6;display:flex;flex-direction:column;min-height:0;border-right:1px solid #c3cbc6}
#contents,#results{padding:8px 16px 16px;overflow:auto;min-height:0;overflow-anchor:none}#backToToc{margin:12px 16px 0;text-align:left}
h2{font-size:16px;margin:10px 0}.toc-row{display:flex;align-items:flex-start}.toc-children{margin-left:14px}
#toc button{color:inherit;text-align:left;border:0;background:transparent;overflow-wrap:anywhere}#toc button:hover{background:#dbe2d7}
.toc-page,.toc-group{flex:1;min-width:0}.toc-group{font-weight:bold}.toc-toggle::before,.toc-group::before{content:'▸';display:inline-block;width:1em}
.toc-toggle[aria-expanded=true]::before,.toc-group[aria-expanded=true]::before{content:'▾'}
#toc .toc-toggle{padding:8px 2px}.toc-row>span{padding:8px}
#results button{display:block;width:100%;margin:8px 0;text-align:left;background:white}#results strong{display:block}#results small{display:block;margin-top:6px;color:#51605b;line-height:1.6}
#reading{flex:1;min-width:0;display:flex;flex-direction:column}#pageinfo{padding:9px 16px;font-size:14px;background:#e2e8e7}
iframe{border:0;flex:1;width:100%;background:white}#status{padding:10px 20px;min-height:42px;border-top:1px solid #ccd2cd}#status.error{color:#922c32}#empty{padding:50px 30px;color:#536c66}
@media(max-width:760px){header{gap:8px;padding:10px}aside{width:230px;min-width:180px}form{width:100%}input{flex:1}}
[hidden]{display:none!important}
</style>
<header><span class="brand-mark" aria-label="NNC">NNC</span><h1 id="booktitle">CHM 閱讀器</h1><button id="open">開啟 CHM</button>
<label>編碼<select id="encoding"><option value="auto">自動偵測</option><option value="gb18030">GB18030（含 GBK／GB2312）</option><option value="utf-8">UTF-8</option><option value="cp950">Big5</option></select></label>
<label>內文字級<select id="fontSize" disabled><option value="100">100%（原始）</option></select></label>
<form id="search"><input id="query" type="search" aria-label="全文搜尋" placeholder="全文搜尋（繁簡互通）"><button>搜尋</button></form><button id="exit">關閉閱讀器</button></header>
<main><aside><button id="backToToc" hidden>← 返回完整目錄</button><section id="results" hidden><h2 id="resultcount">搜尋結果</h2><div id="matches"></div><button id="more" hidden>顯示更多結果</button></section><section id="contents"><h2>目錄</h2><nav id="toc" aria-label="電子書目錄"></nav></section></aside>
<section id="reading"><div id="pageinfo">尚未開啟電子書</div><div id="empty">按「開啟 CHM」選擇電子書，或將 CHM 檔拖到 CHMViewer.exe。</div><iframe id="page" title="電子書內文" sandbox="allow-same-origin" hidden></iframe></section></main>
<div id="status" role="status" aria-live="polite">就緒</div>
<script>
'use strict';
const el=id=>document.getElementById(id),prefix=location.pathname;
let characters={},current=null,query='',revision=0,currentPath='';
function busy(value){document.querySelector('aside').inert=value;for(const node of document.querySelectorAll('header button,header input,header select'))if(node.id!=='exit')node.disabled=value;}
function status(message,error=false){el('status').textContent=message;el('status').className=error?'error':'';}
async function api(path,data){
 const response=await fetch(prefix+'api/'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const result=await response.json();if(!response.ok)throw Error(result.error||'操作失敗');return result;
}
function normalize(text){return Array.from(text,c=>characters[c]||c).join('');}
const originalStyles=new WeakMap();
function applyFontSize(){
 const doc=el('page').contentDocument;
 if(!doc?.body)return;
 const previous=originalStyles.get(doc);
 if(previous){
  for(const [node,style] of previous){
   if(style===null)node.removeAttribute('style');else node.setAttribute('style',style);
  }
  originalStyles.delete(doc);
 }
 const scale=Number(el('fontSize').value)/100;
 if(scale===1)return;
 // 先量完整頁的原始字級與行高，再一次套用；巢狀 em 和舊式 font 標籤都只會縮放一次。
 const metrics=[];
 for(const node of [doc.body,...doc.body.getElementsByTagName('*')]){
  if(!(node instanceof doc.defaultView.HTMLElement)||node.matches('script,style,link,meta'))continue;
  const computed=doc.defaultView.getComputedStyle(node);
  metrics.push([node,node.getAttribute('style'),parseFloat(computed.fontSize),parseFloat(computed.lineHeight)]);
 }
 originalStyles.set(doc,metrics);
 for(const [node,,size,height] of metrics){
  node.style.setProperty('font-size',(size*scale)+'px','important');
  if(Number.isFinite(height))node.style.setProperty('line-height',(height*scale)+'px','important');
 }
}
el('fontSize').onchange=async()=>{
 const percent=Number(el('fontSize').value);
 applyFontSize();busy(true);
 try{await api('font-size',{percent});}
 catch(e){status('已套用字級，但無法儲存設定：'+e.message,true);}
 finally{busy(false);}
};
function openPage(path,fragment=''){
 if(!path)return;currentPath=path;el('empty').hidden=true;el('page').hidden=false;
 el('page').src=prefix+'book/'+path.split('/').map(encodeURIComponent).join('/').replace(/^\//,'')+'?revision='+revision+(fragment?'#'+encodeURIComponent(fragment):'');
 el('pageinfo').textContent='載入頁面…';
}
function buildToc(items){
 const toc=document.createDocumentFragment();
 const parents=[];
 for(const [i,item] of items.entries()){
  while(parents.length && parents.at(-1).depth>=item.depth)parents.pop();
  const container=parents.length?parents.at(-1).children:toc;
  const row=document.createElement('div');row.className='toc-row';container.append(row);
  const branch=items[i+1]?.depth>item.depth;
  if(branch){
   const children=document.createElement('div');children.className='toc-children';children.hidden=true;
   children.id='toc-children-'+i;
   const toggle=document.createElement('button');
   toggle.className=item.path?'toc-toggle':'toc-group';
   toggle.setAttribute('aria-label',item.path?'展開或收合 '+item.title:item.title);
   if(!item.path)toggle.textContent=item.title;
   toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-controls',children.id);
   toggle.onclick=()=>{children.hidden=!children.hidden;toggle.setAttribute('aria-expanded',String(!children.hidden));};
   row.append(toggle);container.append(children);parents.push({depth:item.depth,children});
  }
  if(item.path || !branch){
   const label=document.createElement(item.path?'button':'span');label.textContent=item.title;
   if(item.path){label.className='toc-page';label.onclick=()=>openPage(item.path,item.fragment);}
   row.append(label);
  }
 }
 el('toc').replaceChildren(toc);
}
function showResults(active){
 el('contents').hidden=active;el('results').hidden=!active;el('backToToc').hidden=!active;
}
function clearSearch(){
 query='';el('query').value='';el('matches').replaceChildren();el('more').onclick=null;
 showResults(false);highlight();status('已返回完整目錄。');
}
el('backToToc').onclick=clearSearch;
el('query').oninput=()=>{if(!el('query').value && !el('results').hidden)clearSearch();};
function showBook(book){
 current=book;revision=book.revision;clearSearch();
 el('booktitle').textContent=book.title;document.title=book.title+' — CHM 閱讀器';el('encoding').value=book.encoding;
 buildToc(book.toc);el('contents').scrollTop=0;
 if(book.home)openPage(book.home);status(book.pages?'已開啟，共 '+book.pages+' 頁。':'請選擇 CHM 電子書。');
}
function highlight(){
 const doc=el('page').contentDocument;if(!doc||!doc.body)return;
 for(const mark of Array.from(doc.querySelectorAll('mark[data-chm-hit]')))mark.replaceWith(doc.createTextNode(mark.textContent));
 doc.body.normalize();if(!query)return;
 const nodes=[],walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
 while(walker.nextNode()){const node=walker.currentNode;if(!node.parentElement.closest('script,style,title,head'))nodes.push(node);}
 let text='';const positions=[];
 for(const node of nodes){let offset=0;for(const char of Array.from(node.data)){
  const mapped=normalize(char);text+=mapped;for(let i=0;i<mapped.length;i++)positions.push({node:node,from:offset,to:offset+char.length});offset+=char.length;
 }}
 const needle=normalize(query.trim()),segments=[];if(!needle)return;let count=0;
 for(let at=text.indexOf(needle);at>=0;at=text.indexOf(needle,at+needle.length)){
  count++;let segment=null;
  for(let i=at;i<at+needle.length;i++){const pos=positions[i];if(segment&&segment.node===pos.node)segment.to=pos.to;else{segment={node:pos.node,from:pos.from,to:pos.to};segments.push(segment);}}
 }
 for(const segment of segments.reverse()){const range=doc.createRange();range.setStart(segment.node,segment.from);range.setEnd(segment.node,segment.to);const mark=doc.createElement('mark');mark.dataset.chmHit='';range.surroundContents(mark);}
 const first=doc.querySelector('mark[data-chm-hit]');if(first)first.scrollIntoView({block:'center'});
 status(count?'本頁找到 '+count+' 處，已標示並捲動到第一處。':'本頁沒有符合的文字。');
}
el('page').addEventListener('load',()=>{const doc=el('page').contentDocument;if(doc){el('pageinfo').textContent=doc.title||currentPath;applyFontSize();highlight();}});
el('open').onclick=async()=>{
 const previousStatus=el('status').textContent,previousError=el('status').className==='error';
 busy(true);status('請在檔案對話框選擇 CHM…');
 try{const book=await api('open',{});if(book.revision!==revision)showBook(book);else status(previousStatus,previousError);}
 catch(e){status(e.message,true);}finally{busy(false);}
};
el('encoding').onchange=async()=>{busy(true);status('重新解碼並建立全文索引…');try{showBook(await api('encoding',{encoding:el('encoding').value}));}catch(e){el('encoding').value=current.encoding;status(e.message,true);}finally{busy(false);}};
el('search').onsubmit=async event=>{
 event.preventDefault();const searchQuery=el('query').value.trim();if(!searchQuery){clearSearch();return;}
 busy(true);status('搜尋整本書…');
 try{const matches=await api('search?q='+encodeURIComponent(searchQuery));query=searchQuery;
 el('matches').replaceChildren();showResults(true);el('results').scrollTop=0;
 let displayed=0;
 function showMore(){
  const rows=document.createDocumentFragment();
  for(const match of matches.slice(displayed,displayed+100)){
   const button=document.createElement('button'),title=document.createElement('strong'),snippet=document.createElement('small');
   title.textContent=match.title+'（'+match.count+' 處）';snippet.textContent=match.snippet;button.append(title,snippet);
   button.onclick=()=>{query=searchQuery;openPage(match.path);};rows.append(button);displayed++;
  }
  el('matches').append(rows);el('more').hidden=displayed>=matches.length;
 }
 el('resultcount').textContent='搜尋結果（'+matches.length+' 頁）';el('more').onclick=showMore;showMore();
 highlight();status('找到 '+matches.length+' 個頁面。');}catch(e){status(e.message,true);}finally{busy(false);}
};
el('exit').onclick=async()=>{el('exit').disabled=true;try{await api('exit',{});window.close();status('閱讀器已結束。');}catch(e){el('exit').disabled=false;status(e.message,true);}};
(async()=>{try{
 const [map,book,font]=await Promise.all([api('characters'),api('book'),api('font-size')]);
 characters=map;
 el('fontSize').replaceChildren(...font.choices.map(n=>new Option(n===100?'100%（原始）':n+'%',String(n))));
 el('fontSize').value=String(font.percent);el('fontSize').disabled=false;showBook(book);
}catch(e){status(e.message,true);}})();
</script></html>
